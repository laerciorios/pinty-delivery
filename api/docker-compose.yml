services:
  database:
    image: postgres:17.4
    container_name: pinty-delivery-db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - ${DB_PORT:-5432}:5432
    environment:
      - POSTGRES_DB=${DB_NAME:-pinty_delivery}
      - POSTGRES_USER=${DB_USERNAME:-root}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-12345678}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_NAME:-pinty_delivery} -h database -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  api:
    build: .
    container_name: pinty-delivery-api
    ports:
      - ${API_PORT:-3333}:3333
    environment:
      - DB_HOST=database
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-pinty_delivery}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-12345678}
    depends_on:
      database:
        condition: service_healthy

volumes:
  db_data:

networks:
  default:
    name: pinty_delivery_network